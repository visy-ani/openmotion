name: openmotion-cloud

services:
  openmotion:
    container_name: openmotion-cloud
    image: ${OPENMOTION_IMAGE:-openmotion:local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      PORT: ${OPENMOTION_PORT:-4173}
      # Cloud control plane: routes Super Agent runs to connected local-bridge
      # workstations or remote openmotion-agent-v1 services while disabling server-side local CLIs.
      MOTION_DEPLOYMENT_MODE: ${MOTION_DEPLOYMENT_MODE:-cloud}
      MOTION_PUBLIC_ORIGIN: ${MOTION_PUBLIC_ORIGIN:?Set MOTION_PUBLIC_ORIGIN to your public HTTPS origin}
      MOTION_ALLOWED_HOSTS: ${MOTION_ALLOWED_HOSTS:-}
      MOTION_MCP_REQUIRE_AUTH: ${MOTION_MCP_REQUIRE_AUTH:-1}
      MOTION_HEADLESS: ${MOTION_HEADLESS:-1}
      DO_NOT_TRACK: ${DO_NOT_TRACK:-}
    ports:
      # Put a TLS-terminating reverse proxy (Caddy, Nginx, Traefik, Cloudflare Tunnel) in front
      # when exposing over the public internet; keep loopback bind by default.
      - "${OPENMOTION_BIND_ADDRESS:-127.0.0.1}:${OPENMOTION_PORT:-4173}:${OPENMOTION_PORT:-4173}"
    volumes:
      - openmotion_cloud_data:/data
    security_opt:
      - no-new-privileges:true
    mem_limit: ${OPENMOTION_MEM_LIMIT:-4g}
    pids_limit: 1024
    shm_size: 1g

volumes:
  openmotion_cloud_data:
